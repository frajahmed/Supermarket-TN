# Gesamtprüfung auf GitHub – derselbe Lauf, mit dem Claude Lieferungen abnimmt.
# Läuft bei jedem Push und jedem Pull Request; ohne grünen Lauf wird nichts gemergt.
name: Gesamtprüfung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      STN_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: PostgreSQL-Client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Pakete Backend
        working-directory: backend
        run: npm ci

      - name: Gesamtprüfung
        run: bash scripts/test-all.sh

      - name: Keine übersprungenen Prüfungen
        run: |
          bash scripts/test-all.sh > test-output.txt 2>&1 || true
          if grep -q '^SKIP' test-output.txt; then
            echo "Übersprungene Prüfungen sind in CI nicht erlaubt:"; grep '^SKIP' test-output.txt; exit 1
          fi
